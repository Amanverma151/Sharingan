<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watchful wallpaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#050506; --ink:#e9e2e2; --ink-dim:#8d8486;
  --blood:#c4202c; --ember:#ff4a52; --glass:rgba(22,20,22,.62); --edge:rgba(255,255,255,.08);
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --void:#050506; --ink:#e9e2e2; } }
:root[data-theme="dark"]{ --void:#050506; --ink:#e9e2e2; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);overflow:hidden;
  font-family:"Zen Kaku Gothic New",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
#wall{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0}
.glow{position:fixed;width:0;height:0;pointer-events:none;mix-blend-mode:screen;opacity:0;
  transition:opacity .45s ease}
.glow::before{content:"";position:absolute;left:var(--r-neg);top:var(--r-neg);width:var(--d);height:var(--d);border-radius:50%;
  background:radial-gradient(circle,rgba(255,30,45,.32) 0%,rgba(200,10,30,.14) 40%,rgba(160,0,20,0) 70%)}
body.locked .glow{opacity:1}
.dock{position:fixed;z-index:2;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  display:flex;gap:6px;padding:8px;border-radius:20px;background:var(--glass);
  border:1px solid var(--edge);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 18px 40px rgba(0,0,0,.55)}
.app{position:relative;width:54px;height:54px;border:0;padding:0;border-radius:14px;cursor:pointer;
  background:var(--tile);color:#f4eeee;display:grid;place-items:center;
  transition:transform .25s cubic-bezier(.2,.9,.3,1.3),box-shadow .3s ease}
.app svg{width:26px;height:26px}
.app::after{content:"";position:absolute;inset:-3px;border-radius:17px;border:1.5px solid var(--ember);opacity:0;
  transform:scale(.9);transition:opacity .25s ease,transform .3s ease}
.app.watched{transform:translateY(-6px)}
.app.watched::after{opacity:1;transform:scale(1)}
.app.watched{box-shadow:0 10px 30px -4px rgba(255,40,55,.55)}
.app:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.label{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translate(-50%,4px);white-space:nowrap;
  font-size:13px;font-weight:500;letter-spacing:.02em;padding:5px 10px;border-radius:8px;
  background:rgba(10,8,9,.9);border:1px solid rgba(255,74,82,.35);opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s ease}
.app.watched .label{opacity:1;transform:translate(-50%,0)}
.spot{position:absolute;left:50%;bottom:-14px;width:46px;height:6px;margin-left:-23px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,50,60,.9),rgba(255,50,60,0) 70%);opacity:0;transition:opacity .3s}
.app.watched .spot{opacity:1}

.hint{position:fixed;left:clamp(20px,4vw,56px);top:calc(clamp(20px,4vw,48px) + env(safe-area-inset-top,0px));
  max-width:22ch;font-size:15px;line-height:1.5;color:var(--ink-dim);transition:opacity .8s ease}
.hint b{display:block;color:var(--ink);font-weight:700;font-size:20px;margin-bottom:4px}
body.seen .hint{opacity:0}
.toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,10px);font-size:14px;padding:8px 14px;border-radius:10px;
  background:rgba(10,8,9,.92);border:1px solid var(--edge);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:560px){ .app{width:40px;height:40px;border-radius:11px} .app svg{width:20px;height:20px} .dock{gap:4px;padding:6px} }
@media (prefers-reduced-motion:reduce){ .app,.app::after,.label{transition:none} }
</style>
</head>
<body>
<canvas id="wall" width="2576" height="1449" aria-label="Wallpaper whose eyes follow the dock"></canvas>

const W0=2576, H0=1449, FOCUS_X=0.5;            // keep the face centered
const MAX = { left:12, right:10, down:7, up:3 }; // how far the irises may travel (px, image space)
const MID = { x:1312, y:435 };

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('wall'), ctx=cv.getContext('2d');
const off=document.createElement('canvas'); const octx=off.getContext('2d');
const dock=document.getElementById('dock'), toast=document.getElementById('toast');
const glowL=document.getElementById('glowL'), glowR=document.getElementById('glowR');

function load(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}

// Build dock
APPS.forEach((a,i)=>{
  const b=document.createElement('button'); b.className='app'; b.style.setProperty('--tile',a.tile);
  b.setAttribute('aria-label',a.name);
  b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${a.icon}</svg><span class="label">${a.name}</span><span class="spot"></span>`;
  const on=()=>watch(b), offF=()=>unwatch(b);
  b.addEventListener('pointerenter',on); b.addEventListener('pointerleave',offF);
  b.addEventListener('focus',on); b.addEventListener('blur',offF);
  b.addEventListener('click',()=>{ watch(b); launch(a); });
  dock.appendChild(b);
});

let watched=null, t=null;
function watch(b){ if(watched&&watched!==b) watched.classList.remove('watched');
  watched=b; b.classList.add('watched'); document.body.classList.add('locked','seen'); }
function unwatch(b){ if(watched===b){ b.classList.remove('watched'); watched=null; document.body.classList.remove('locked'); } }
function launch(a){
  if(window.top!==window){ showToast(`Opening ${a.name} (works once set as your wallpaper)`); return; }
  fetch(`${LAUNCHER}/launch/${encodeURIComponent(a.id)}`,{mode:'no-cors'})
    .then(()=>showToast(`Opening ${a.name}`))
    .catch(()=>showToast('The launcher isn’t running. Start launcher.ps1 and try again.'));
}
function showToast(s){ toast.textContent=s; toast.classList.add('show'); clearTimeout(t); t=setTimeout(()=>toast.classList.remove('show'),1400); }

// Stage mapping (canvas uses object-fit: cover)
let S=1, OX=0, OY=0;
function layout(){
  const w=innerWidth, h=innerHeight; S=Math.max(w/W0,h/H0);
  OX=(w-W0*S)*FOCUS_X; OY=(h-H0*S)/2;
  cv.style.width=W0*S+'px'; cv.style.height=H0*S+'px'; cv.style.left=OX+'px'; cv.style.top=OY+'px';
  [[glowL,EYES.L],[glowR,EYES.R]].forEach(([g,e])=>{
    const d=(e===EYES.L?150:175)*S; g.style.left=OX+e.cx*S+'px'; g.style.top=OY+e.cy*S+'px';
    g.style.setProperty('--d',d+'px'); g.style.setProperty('--r-neg',-d/2+'px');
  });
}
const toImg=(x,y)=>({x:(x-OX)/S, y:(y-OY)/S});
const toScr=(x,y)=>({x:OX+x*S, y:OY+y*S});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

let cur={x:0,y:0}, tgt={x:0,y:0}, assets;
function targetFor(){
  if(!watched) return {x:0,y:0};
  const r=watched.getBoundingClientRect(), p=toImg(r.left+r.width/2, r.top+r.height/2);
  const gx=clamp((p.x-MID.x)/350,-1,1), gy=clamp((p.y-MID.y)/700,-1,1);
  return { x: gx*(gx<0?MAX.left:MAX.right), y: gy*(gy>0?MAX.down:MAX.up) };
}
function drawEye(e,iris,clip,dx,dy){
  ctx.drawImage(assets.base,e.x,e.y,e.w,e.h,e.x,e.y,e.w,e.h);
  off.width=e.w; off.height=e.h;
  octx.globalCompositeOperation='source-over'; octx.drawImage(iris,dx,dy);
  octx.globalCompositeOperation='destination-in'; octx.drawImage(clip,0,0);
  ctx.drawImage(off,e.x,e.y);
}
let last={x:999,y:999};
function frame(){
  tgt=targetFor();
  const k=reduce?1:0.22; cur.x+=(tgt.x-cur.x)*k; cur.y+=(tgt.y-cur.y)*k;
  if(Math.abs(cur.x-last.x)>0.01||Math.abs(cur.y-last.y)>0.01){
    drawEye(EYES.L,assets.irisL,assets.clipL,cur.x,cur.y);
    drawEye(EYES.R,assets.irisR,assets.clipR,cur.x,cur.y);
    last={...cur};
  }
  requestAnimationFrame(frame);
}
Promise.all(Object.values(IMG).map(load)).then(([base,irisL,irisR,clipL,clipR])=>{
  assets={base,irisL,irisR,clipL,clipR};
  cv.style.position='fixed'; ctx.drawImage(base,0,0); layout(); frame();
}).catch(()=>{ document.querySelector('.hint').innerHTML='<b>The wallpaper didn’t load.</b>Reload the page to try again.'; });
addEventListener('resize',layout);
</script>
